name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          mkdir DesktopSwitcher
          cp DesktopSwitcher.ahk VirtualDesktopAccessor.dll LICENSE VirtualDesktopAccessor-LICENSE.txt README.md install.ps1 install.cmd DesktopSwitcher/
          zip -r DesktopSwitcher.zip DesktopSwitcher

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" DesktopSwitcher.zip --title "$GITHUB_REF_NAME" --generate-notes
